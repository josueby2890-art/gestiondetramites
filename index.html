<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Trámites Municipales</title>
<style>
/* ==========================================================================
   IDENTIDAD — Inversiones Bolívar, tema oscuro

   Fondo negro, naranja #FA8D29 como acento principal (igual que el sitio) y
   verde B Corp #00A651 para confirmación y progreso. El navy institucional
   no puede usarse como texto sobre negro —da 1.9:1—, así que aquí vive
   aclarado en --navy; su papel de fondo lo toman --hdr-bg y --acento-bg.

   Todo el tema sale de este bloque. Para volver al tema claro, basta copiar
   aquí los valores del bloque equivalente de @media print, que conserva la
   versión clara íntegra para el papel.
   ========================================================================== */
:root{
  /* Marca, en versiones legibles sobre fondo oscuro */
  --navy:#8FBDF0; --navy-d:#B8D6F7; --navy-l:#5E8FC7;
  --green:#00A651; --green-d:#4FD98E; --green-l:#12301F;
  --orange:#FA8D29; --orange-l:#33220E;
  /* Sobre negro el naranja puro ya rinde 8.2:1, así que aquí --orange-d
     no oscurece: aclara un poco para los textos pequeños. */
  --orange-d:#FFB169;
  --ink:#ECEEF2; --ink-2:#B6BCC7; --ink-3:#8A919E;
  --line:#2A2E36; --line-2:#212429;
  --bg:#0D0E11; --card:#16181D;
  /* Superficies y realces */
  --surf:#1C1F25; --surf-2:#191C21; --hover:#232A36; --surf-ext:#15171B;
  /* Encabezado y pie: negros, que es donde nació el logotipo */
  --hdr-bg:#000000; --hdr-bg2:#000000; --hdr-txt:#A9B2C0;
  --acento-bg:#262E3B; --acento-bg-h:#323C4C;
  --green-h:#00C25E; --btn-g-txt:#04240F;
  --hdr-txt2:#C7CEDA; --hdr-txt3:#8A939F; --hdr-sep:rgba(255,255,255,.14);
  /* Tintes de etiquetas y avisos */
  --tint-navy:#14202E;   --brd-navy:#24374C;
  --tint-dep:#2E1A12;    --brd-dep:#4A2A1C;   --txt-dep:#F0A183;
  --tint-var:#221C33;    --brd-var:#372C52;   --txt-var:#C2A9F0;
  --tint-modo:#22262E;
  --aviso-txt:#F0C08A;
  --varbar:#171B22;
  /* Sombras: sobre negro no sirve teñirlas de azul, hay que profundizarlas */
  --sombra-1:rgba(0,0,0,.5);  --sombra-2:rgba(0,0,0,.42);
  --sombra-3:rgba(0,0,0,.62); --overlay:rgba(0,0,0,.72);
  --foco:rgba(143,189,240,.24); --fab-sombra:rgba(0,0,0,.6);
  --radius:10px;
  --shadow:0 1px 2px var(--sombra-1),0 4px 14px var(--sombra-2);
  --shadow-lg:0 10px 40px var(--sombra-3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* ---------- HEADER ---------- */
.hdr{background:var(--hdr-bg);color:#fff;padding:0}
.hdr-in{max-width:1280px;margin:0 auto;padding:18px 24px 0}
.hdr-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
/* Ranura del logotipo: la llena la constante LOGO del <script>. */
.logo{display:flex;align-items:center;flex-shrink:0;height:40px}
.logo img{max-height:40px;width:auto;display:block}
.hdr-div{width:1px;height:34px;background:var(--hdr-sep);flex-shrink:0;margin:0 6px}
/* En pantallas angostas el logotipo cede espacio antes que el título */
@media(max-width:620px){
  .logo img{max-height:32px}
  .hdr-div{display:none}
}
.hdr h1{font-size:19px;font-weight:bold;letter-spacing:-.2px}
.hdr .sub{font-size:12.5px;color:var(--hdr-txt);margin-top:1px}
.hdr-stats{margin-left:auto;display:flex;gap:22px}
.hstat b{display:block;font-size:20px;line-height:1.1}
.hstat span{font-size:11px;color:var(--hdr-txt);text-transform:uppercase;letter-spacing:.5px}
.nav{display:flex;gap:2px;margin-top:16px;overflow-x:auto}
.nav button{
  padding:10px 16px;font-size:13.5px;color:var(--hdr-txt2);
  border-bottom:3px solid transparent;white-space:nowrap;
}
.nav button:hover{color:#fff}
.nav button.on{color:#fff;border-bottom-color:var(--orange);font-weight:bold}

/* ---------- LAYOUT ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:22px 24px 60px}
.cols{display:grid;grid-template-columns:236px 1fr;gap:22px;align-items:start}
@media(max-width:880px){.cols{grid-template-columns:1fr}}

/* ---------- SEARCH ---------- */
.searchbar{position:relative;margin-bottom:18px}
.searchbar input{
  width:100%;padding:13px 15px 13px 42px;font-size:15px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--card);color:var(--ink);outline:none;
}
.searchbar input:focus{border-color:var(--navy-l);box-shadow:0 0 0 3px var(--foco)}
.searchbar svg{position:absolute;left:14px;top:14px;color:var(--ink-3)}
.clearx{position:absolute;right:10px;top:9px;padding:5px 9px;color:var(--ink-3);font-size:16px;border-radius:6px}
.clearx:hover{background:var(--line-2);color:var(--ink)}

/* ---------- FILTERS ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.fgroup{padding:14px 16px;border-bottom:1px solid var(--line-2)}
.fgroup:last-child{border-bottom:none}
.fgroup h4{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--ink-3);margin-bottom:9px;font-weight:bold;
}
.fopt{
  display:flex;align-items:center;gap:8px;padding:6px 8px;margin:0 -8px;
  border-radius:6px;font-size:13px;color:var(--ink-2);width:calc(100% + 16px);text-align:left;
}
.fopt:hover{background:var(--line-2)}
.fopt.on{background:var(--acento-bg);color:#fff;font-weight:bold}
.fopt .n{margin-left:auto;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums;padding-left:8px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ---------- CARDS ---------- */
.resline{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12.5px;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;text-align:left;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:9px;width:100%;
  transition:border-color .12s,transform .12s,box-shadow .12s;
}
.card:hover{border-color:var(--navy-l);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card-top{display:flex;align-items:flex-start;gap:9px}
.card h3{font-size:14.5px;font-weight:bold;color:var(--navy);line-height:1.35;flex:1}
.card p{font-size:12.5px;color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.tag{
  font-size:10.5px;padding:3px 8px;border-radius:20px;font-weight:bold;
  border:1px solid var(--line);color:var(--ink-2);background:var(--surf-2);
  text-transform:uppercase;letter-spacing:.3px;
}
.tag.cost{background:var(--tint-navy);border-color:var(--brd-navy);color:var(--navy)}
.tag.dep{background:var(--tint-dep);border-color:var(--brd-dep);color:var(--txt-dep)}
.empty{padding:60px 20px;text-align:center;color:var(--ink-3);grid-column:1/-1}
.empty b{display:block;font-size:16px;color:var(--ink-2);margin-bottom:6px}

/* ---------- MODAL ---------- */
.ov{
  position:fixed;inset:0;background:var(--overlay);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:32px 20px;overflow-y:auto;
}
.modal{
  background:var(--card);border-radius:12px;max-width:820px;width:100%;
  box-shadow:var(--shadow-lg);overflow:hidden;
}
.m-hdr{background:var(--hdr-bg);color:#fff;padding:20px 24px;position:relative}
.m-hdr h2{font-size:19px;font-weight:bold;line-height:1.3;padding-right:40px}
.m-hdr .meta{font-size:12.5px;color:var(--hdr-txt);margin-top:7px;line-height:1.6}
.m-hdr .meta b{color:#fff;font-weight:normal}
.mx{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:7px;color:var(--hdr-txt);font-size:20px}
.mx:hover{background:var(--hdr-sep);color:#fff}
.m-tabs{display:flex;background:var(--surf);border-bottom:1px solid var(--line)}
.m-tabs button{padding:12px 18px;font-size:13px;color:var(--ink-2);border-bottom:3px solid transparent}
.m-tabs button:hover{color:var(--navy)}
.m-tabs button.on{color:var(--navy);font-weight:bold;border-bottom-color:var(--orange);background:var(--card)}
.varbar{
  display:flex;align-items:center;gap:11px;padding:12px 24px;
  background:var(--varbar);border-bottom:1px solid var(--line);
}
.varbar label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--navy);font-weight:bold}
.varbar select{
  flex:1;padding:7px 10px;font-family:inherit;font-size:13px;color:var(--ink);
  border:1px solid var(--line);border-radius:7px;background:var(--card);
}
.varbar select:focus{outline:none;border-color:var(--navy-l);box-shadow:0 0 0 3px var(--foco)}
.varprint{padding:10px 0;font-size:11pt;color:#333;border-bottom:1px solid #999;margin-bottom:10px}
.m-body{padding:22px 24px;max-height:60vh;overflow-y:auto}
.m-foot{padding:14px 24px;border-top:1px solid var(--line);background:var(--surf);display:flex;gap:10px;justify-content:flex-end}

/* ---------- CONTENT BLOCKS ---------- */
.sec{margin-bottom:24px}
.sec:last-child{margin-bottom:0}
.sec h4{
  font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--navy);
  font-weight:bold;padding-bottom:7px;border-bottom:2px solid var(--line-2);margin-bottom:11px;
  display:flex;align-items:center;gap:8px;
}
.sec h4 .cnt{
  background:var(--acento-bg);color:#fff;border-radius:20px;padding:1px 7px;
  font-size:10px;letter-spacing:0;
}
.rq{list-style:none}
.rq li{
  display:flex;gap:10px;padding:8px 0;font-size:13.5px;
  color:var(--ink-2);line-height:1.55;border-bottom:1px solid var(--line-2);
}
.rq li:last-child{border-bottom:none}
.rq li::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--green);
  flex-shrink:0;margin-top:7px;
}
.rq li.sub{padding-left:22px;font-size:13px}
.rq li.sub::before{background:var(--line);width:5px;height:5px}
.na{color:var(--ink-3);font-style:italic;font-size:13px;padding:6px 0}
.note{
  background:var(--orange-l);border-left:3px solid var(--orange);
  padding:11px 14px;border-radius:0 7px 7px 0;font-size:13px;color:var(--aviso-txt);line-height:1.55;
}
.note.blue{background:var(--tint-navy);border-left-color:var(--navy-l);color:var(--navy-d)}

/* ---------- CHECKLIST ---------- */
.ck-bar{
  display:flex;align-items:center;gap:12px;margin-bottom:16px;
  padding:12px 14px;background:var(--surf);border:1px solid var(--line);border-radius:8px;
}
.ck-track{flex:1;height:7px;background:var(--line);border-radius:20px;overflow:hidden}
.ck-fill{height:100%;background:var(--green);border-radius:20px;transition:width .25s}
.ck-num{font-size:12.5px;font-weight:bold;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
.ck{list-style:none}
.ck li{border-bottom:1px solid var(--line-2)}
.ck label{
  display:flex;gap:11px;padding:10px 8px;margin:0 -8px;font-size:13.5px;
  color:var(--ink-2);line-height:1.55;cursor:pointer;border-radius:6px;align-items:flex-start;
}
.ck label:hover{background:var(--line-2)}
.ck input{margin-top:3px;width:16px;height:16px;accent-color:var(--green);flex-shrink:0;cursor:pointer}
.ck input:checked + span{color:var(--ink-3);text-decoration:line-through}
.ck .grp{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);
  font-weight:bold;padding:14px 0 5px;border-bottom:none;
}

/* ---------- BUTTONS ---------- */
.btn{
  padding:9px 17px;border-radius:7px;font-size:13px;font-weight:bold;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.p{background:var(--acento-bg);border-color:var(--acento-bg);color:#fff}
.btn.p:hover{background:var(--acento-bg-h);border-color:var(--acento-bg-h)}
.btn.g{background:var(--green);border-color:var(--green);color:var(--btn-g-txt)}
.btn.g:hover{background:var(--green-h);border-color:var(--green-h)}

/* ---------- TABLES ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card)}
.tbl th{
  text-align:left;padding:11px 14px;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.7px;color:#fff;background:var(--acento-bg);font-weight:bold;
}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--surf)}
.tbl .money{font-weight:bold;color:var(--green-d);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .link{color:var(--navy);font-weight:bold;text-align:left;text-decoration:underline;text-underline-offset:2px}
.tbl .link:hover{color:var(--green-d)}

/* ---------- VIEW HEADERS ---------- */
.vh{margin-bottom:20px}
.vh h2{font-size:20px;color:var(--navy);font-weight:bold;margin-bottom:5px}
.vh p{font-size:13.5px;color:var(--ink-2);max-width:760px;line-height:1.6}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.box-h{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surf)}
.box-h h3{font-size:14px;color:var(--navy);font-weight:bold}
.box-h p{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.box-b{padding:18px}

/* ---------- COMMON DOCS ---------- */
.cd{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.cd:last-child{border-bottom:none}
.cd-name{flex:1;font-size:13.5px;color:var(--ink)}
.cd-bar{width:130px;height:7px;background:var(--line);border-radius:20px;overflow:hidden;flex-shrink:0}
.cd-bar i{display:block;height:100%;background:var(--navy-l);border-radius:20px}
.cd-n{font-size:12px;color:var(--ink-3);width:74px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

/* ---------- DEPENDENCIES ---------- */
.dep-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.dep-row:last-child{border-bottom:none}
.chip{
  padding:7px 13px;border-radius:7px;font-size:12.5px;font-weight:bold;
  border:1px solid var(--line);background:var(--card);color:var(--navy);text-align:left;
}
.chip:hover{border-color:var(--navy-l);background:var(--hover)}
.chip-alc{
  font-style:normal;font-size:9.5px;font-weight:bold;margin-left:7px;
  padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px;
}
.chip-modo{
  font-style:normal;font-size:9.5px;font-weight:normal;margin-left:6px;
  padding:2px 6px;border-radius:4px;background:var(--tint-modo);color:var(--ink-3);
}
.chip-modo.documento{background:var(--tint-navy);color:var(--navy)}
.chip-si{
  font-style:normal;font-size:9.5px;font-weight:normal;margin-left:6px;
  padding:2px 6px;border-radius:4px;background:var(--tint-dep);color:var(--txt-dep);
}
.tag.var{background:var(--tint-var);border-color:var(--brd-var);color:var(--txt-var)}
.rq.opc li::before{background:var(--orange)}
.opc-txt{font-style:italic}
.altgrupo{
  margin-top:12px;padding:11px 13px;border:1px dashed var(--line);
  border-radius:8px;background:var(--surf-2);
}
.altlabel{
  display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--orange-d);font-weight:bold;margin-bottom:8px;
}
.altchips{display:flex;gap:8px;flex-wrap:wrap}
.altinline{
  display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:5px 9px;border:1px dashed var(--line);border-radius:8px;background:var(--surf-2);
}
.alto{font-style:normal;font-size:11px;color:var(--orange-d);font-weight:bold;text-transform:uppercase}
.condiciones{list-style:none;margin-top:11px;padding-left:0}
.condiciones li{
  font-size:12.5px;color:var(--ink-2);padding:5px 0 5px 12px;
  border-left:2px solid var(--orange);margin-bottom:4px;line-height:1.5;
}
.tramos{list-style:none;margin-top:8px;padding-left:0}
.tramos li{font-size:12.5px;padding:3px 0;color:inherit;opacity:.92}
.tramos li b{font-variant-numeric:tabular-nums;margin-right:6px}
.chip.ext{background:var(--surf-ext);color:var(--ink-3);border-style:dashed;cursor:default}
.chip.ext:hover{background:var(--surf-ext);border-color:var(--line)}
.arrow{color:var(--orange-d);font-size:17px;font-weight:bold;flex-shrink:0}
.dep-req{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:200px}

/* ---------- PRINT ---------- */
/* ---------- AGENTE ---------- */
.ag-fab{
  position:fixed;right:22px;bottom:22px;z-index:90;
  width:52px;height:52px;border-radius:50%;background:var(--hdr-bg);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 22px var(--fab-sombra);transition:transform .12s,background .12s;
}
.ag-fab:hover{background:var(--acento-bg-h);transform:translateY(-2px)}
.ag-fab.on{background:var(--green)}
.ag-panel{
  position:fixed;right:22px;bottom:86px;z-index:91;
  width:min(420px, calc(100vw - 44px));max-height:min(620px, calc(100vh - 130px));
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;
}
/* El display:flex de arriba gana sobre el [hidden] del navegador, así que hay
   que ocultarlo explícitamente: sin esto el panel arranca abierto y el botón
   de cerrar pone el atributo pero no oculta nada. */
.ag-panel[hidden]{display:none}
.ag-hdr{
  background:var(--hdr-bg);color:#fff;padding:13px 16px;
  display:flex;align-items:flex-start;gap:10px;flex-shrink:0;
}
.ag-hdr b{font-size:14px;display:block}
.ag-hdr span{font-size:11.5px;color:var(--hdr-txt);display:block;margin-top:2px}
.ag-x{margin-left:auto;width:26px;height:26px;border-radius:6px;color:var(--hdr-txt);font-size:19px;flex-shrink:0}
.ag-x:hover{background:var(--hdr-sep);color:#fff}
.ag-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.ag-msg{max-width:92%;font-size:13.5px;line-height:1.6}
.ag-msg.yo{
  align-self:flex-end;background:var(--acento-bg);color:#fff;
  padding:9px 13px;border-radius:12px 12px 3px 12px;
}
.ag-msg.bot{
  align-self:flex-start;background:var(--surf);color:var(--ink);
  padding:11px 14px;border-radius:12px 12px 12px 3px;border:1px solid var(--line);
}
.ag-msg.bot b{color:var(--navy)}
.ag-msg.bot ul{list-style:none;margin:8px 0 0}
.ag-msg.bot li{padding:4px 0 4px 14px;position:relative}
.ag-msg.bot li::before{content:"";position:absolute;left:0;top:12px;width:5px;height:5px;border-radius:50%;background:var(--green)}
.ag-msg.bot li.sub{padding-left:28px;font-size:13px;color:var(--ink-2)}
.ag-msg.bot li.sub::before{left:14px;background:var(--line)}
.ag-msg.bot mark{
  background:var(--orange-l);color:var(--orange-d);
  padding:0 2px;border-radius:3px;font-weight:bold;
}
.cita{font-style:italic}
.cita-de{
  font-style:normal;font-size:10.5px;color:var(--ink-3);
  background:var(--tint-modo);padding:1px 6px;border-radius:4px;margin-left:5px;
  white-space:nowrap;
}
.ag-msg.bot .avisa{
  display:block;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3);
}
.ag-cta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ag-cta button{
  font-size:12px;padding:5px 10px;border-radius:6px;
  border:1px solid var(--line);background:var(--card);color:var(--navy);font-weight:bold;
}
.ag-cta button:hover{border-color:var(--navy-l);background:var(--hover)}
.ag-sug{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ag-sug button{
  text-align:left;font-size:12.5px;padding:8px 11px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);line-height:1.45;
}
.ag-sug button:hover{border-color:var(--navy-l);background:var(--hover);color:var(--navy)}
.ag-form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--surf);flex-shrink:0}
.ag-form input{
  flex:1;padding:9px 12px;font-size:13.5px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--ink);outline:none;
}
.ag-form input:focus{border-color:var(--navy-l);box-shadow:0 0 0 3px var(--foco)}
.ag-form .btn{padding:9px 15px}
@media(max-width:520px){
  .ag-panel{right:12px;left:12px;bottom:78px;width:auto}
  .ag-fab{right:14px;bottom:14px}
}

/* ---------- PIE DE MARCA ---------- */
.pie{
  background:var(--hdr-bg2);color:var(--hdr-txt);margin-top:48px;
  border-top:4px solid var(--orange);
}
.pie-in{
  max-width:1280px;margin:0 auto;padding:26px 24px;
  display:flex;align-items:center;gap:26px;flex-wrap:wrap;
}
/* El botón flotante del asistente vive en la esquina inferior derecha:
   sin este margen se monta encima del sello B Corp. */
@media(min-width:641px){ .pie-in{padding-right:96px} }
.pie-frase{
  flex:1;min-width:260px;font-size:14px;line-height:1.6;color:#fff;
  font-style:italic;
}
.pie-frase b{font-style:normal;color:var(--orange);font-weight:bold}
.pie-nota{font-size:11.5px;color:var(--hdr-txt3);margin-top:8px;font-style:normal;line-height:1.55}
.bcorp{
  display:flex;align-items:center;gap:11px;flex-shrink:0;
  padding-left:26px;border-left:1px solid var(--hdr-sep);
}
.bcorp-sello{flex-shrink:0}
.bcorp-txt{font-size:11px;line-height:1.4;color:var(--hdr-txt)}
.bcorp-txt b{display:block;color:#fff;font-size:12.5px}
@media(max-width:640px){
  .bcorp{padding-left:0;border-left:none;border-top:1px solid var(--hdr-sep);padding-top:18px;width:100%}
}

.print-only{display:none}
@media print{
  /* El papel sigue siendo blanco: se restituye la paleta clara íntegra, o
     el checklist saldría en texto gris claro sobre blanco. */
  :root{
    --navy:#1B3A6B; --navy-d:#132A4E; --navy-l:#2C5497;
    --green:#00A651; --green-d:#00803E; --green-l:#E6F6ED;
    --orange:#FA8D29; --orange-l:#FFF2E4; --orange-d:#A85405;
    --ink:#1A1D23; --ink-2:#4A525E; --ink-3:#7A828E;
    --line:#DFE3E9; --line-2:#EDF0F4;
    --bg:#FFFFFF; --card:#FFFFFF;
    --surf:#FFFFFF; --surf-2:#FFFFFF; --hover:#FFFFFF; --surf-ext:#F6F7F9;
    --hdr-bg:#1B3A6B; --hdr-bg2:#132A4E; --hdr-txt:#333333;
    --acento-bg:#1B3A6B; --acento-bg-h:#132A4E;
    --green-h:#00803E; --btn-g-txt:#fff;
    --hdr-txt2:#333333; --hdr-txt3:#555555;
    --tint-navy:#EEF3FB;  --brd-navy:#CDDCF0;
    --tint-dep:#FDF0EC;   --brd-dep:#F6CFC3;  --txt-dep:#B04A26;
    --tint-var:#F1EDFA;   --brd-var:#DED2F4;  --txt-var:#553396;
    --tint-modo:#EEF1F5;  --aviso-txt:#8A4A0B; --varbar:#FFFFFF;
  }
  body{background:#fff;color:#1A1D23;font-size:11pt}
  .hdr,.nav,.searchbar,.panel,.m-tabs,.m-foot,.mx,.ck-bar,.pie,.no-print{display:none!important}
  .ov{position:static;background:none;padding:0;display:block;overflow:visible}
  .modal{box-shadow:none;max-width:100%;border-radius:0}
  .m-hdr{background:#fff!important;color:#000!important;padding:0 0 12px;border-bottom:3px solid #1B3A6B}
  .m-hdr h2{color:#1B3A6B;font-size:16pt}
  .m-hdr .meta,.m-hdr .meta b{color:#333!important}
  .m-body{max-height:none;overflow:visible;padding:16px 0}
  .print-only{display:block}
  /* Con una ficha abierta se imprime solo esa ficha: antes el checklist
     salía precedido de las 47 tarjetas del catálogo. */
  body.con-modal #main{display:none!important}
  /* Los colores de institución vienen en línea desde ENTIDADES y están
     calculados para pantalla oscura; en papel se neutralizan. */
  .tag,.chip-alc{background:#fff!important;border-color:#999!important;color:#333!important}
  .chip{background:#fff!important;color:#000!important;border-color:#666!important}
  /* El margen negativo que en pantalla alinea el realce recorta la casilla
     contra el borde de la página al imprimir. */
  .ck label{page-break-inside:avoid;padding:7px 0;margin:0}
  .ck input{-webkit-appearance:none;appearance:none;width:13px;height:13px;
    border:1.5px solid #333;border-radius:2px;background:#fff}
  .ck input:checked + span{text-decoration:none;color:#000}
  .ck input:checked{background:#333}
  .sec h4{color:#1B3A6B}
  @page{margin:1.6cm}
}
.sig{display:none}
@media print{
  .sig{display:block;margin-top:36px;padding-top:16px;border-top:1px solid #999;
    font-size:10pt;color:#555;display:flex;gap:50px}
  .sig div{flex:1;border-top:1px solid #333;padding-top:5px;margin-top:44px}
}
</style>

<body>

<header class="hdr">

      <button data-view="dependencias">Dependencias</button>

</header>

<main class="wrap" id="main"></main>
<div id="modalRoot"></div>

<footer class="pie no-print">

    <div class="pie-frase">

      <div class="pie-nota" id="pieNota"></div>
    </div>
    <div class="bcorp">

        <circle cx="17" cy="14" r="5.4" fill="none" stroke="#fff" stroke-width="2"/>

</footer>

/* ==========================================================================
   HELPERS
   ========================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const money = n => "$" + n.toFixed(2);
const byId = id => TRAMITES.find(t => t.id === id);

/* Modos de dependencia:
   documento = hay que presentar el trámite resuelto en físico
   estado    = basta con que la condición se cumpla (p. ej. estar solvente) */
const MODO_ETIQUETA = { documento:"en físico", estado:"solo estado", alternativa:"una de estas" };
const depIds  = t => t.depende.map(d => d.id);
const depDe   = t => TRAMITES.filter(o => depIds(o).includes(t.id));
const nPrevios = t => t.depende.length + t.externos.length;

/* Dependencias alternativas: basta cumplir una de cada grupo.
   Devuelve [{grupo, deps:[…]}] y la lista de dependencias sueltas. */
function depGrupos(t){
  const sueltas = [], grupos = new Map();
  t.depende.forEach(d => {
    if(d.modo === "alternativa" && d.grupo){
      if(!grupos.has(d.grupo)) grupos.set(d.grupo, []);
      grupos.get(d.grupo).push(d);
    } else sueltas.push(d);
  });
  return { sueltas, grupos:[...grupos.entries()].map(([grupo, deps]) => ({grupo, deps})) };
}

/* Variantes por tipo de proyecto. Sin variantes, se devuelve una sola
   pseudo-variante vacía para que el resto del código no se ramifique. */
const tieneVariantes = t => Array.isArray(t.variantes) && t.variantes.length > 0;
function variantePorId(t, codigo){
  if(!tieneVariantes(t)) return null;
  return t.variantes.find(v => v.codigo === codigo) || t.variantes[0];
}

/* Costo: fijo {monto}, escalonado {monto, tramos[]} o exigido sin monto {monto:null} */
const tieneMonto = t => !!(t.costo && t.costo.monto != null);
const esEscalonado = t => !!(t.costo && t.costo.tramos);
function costoEtiqueta(t){
  if(!tieneMonto(t)) return null;
  return (esEscalonado(t) ? "desde " : "") + money(t.costo.monto);
}

function allReqs(t, codigoVariante){
  const v = tieneVariantes(t) ? variantePorId(t, codigoVariante) : null;
  const tec = [
    ...t.reqTecnicos.map(x => ({t:x, sub:false, grupo:"Requisitos técnicos"})),
    ...(v ? v.reqTecnicos.map(x => ({t:x, sub:false, grupo:`Requisitos técnicos · ${v.codigo}`})) : [])
  ];
  const opc = (v && v.reqOpcionales) ? v.reqOpcionales.map(x =>
    ({t:x, sub:false, grupo:`Se pueden solicitar según el proyecto · ${v.codigo}`, opcional:true})) : [];
  return [
    ...tec,
    ...opc,
    ...t.reqGenerales.map(x => ({t:x.t, sub:!!x.sub, grupo:t.etiquetaGenerales || "Requisitos generales"}))
  ];
}

/* Chip de trámite: incluye la institución porque varios trámites
   existen con el mismo nombre en más de una */
function chipTramite(id, modo, si){
  const x = byId(id), e = ent(x);
  return `<button class="chip" data-open="${id}"${si ? ` title="Solo si ${esc(si)}"` : ""}>${esc(x.nombre)}`
    + `<i class="chip-alc" style="background:${e.bg};color:${e.fg}">${esc(e.corto)}</i>`
    + (modo && MODO_ETIQUETA[modo] ? `<i class="chip-modo ${modo}">${MODO_ETIQUETA[modo]}</i>` : "")
    + (si ? `<i class="chip-si">condicional</i>` : "")
    + `</button>`;
}

/* Todo el texto de un trámite, incluidas las variantes: sin esto, buscar
   "bitácora" o "hidrológico" no encontraba nada, porque esas palabras solo
   viven dentro de los requisitos de una variante de OPAMSS. */
function textoCompleto(t){
  const partes = [t.nombre, t.descripcion, t.area, t.institucion, t.nota || "",
    ...t.reqTecnicos, ...t.reqGenerales.map(r => r.t), ...t.externos];
  (t.variantes || []).forEach(v => {
    partes.push(v.codigo, v.nombre, ...v.reqTecnicos, ...(v.reqOpcionales || []));
  });
  return partes;
}
function searchBlob(t){ return norm(textoCompleto(t).join(" ")); }

function filtered(){
  const q = norm(state.q).trim();
  return TRAMITES.filter(t => {
    if(state.entidad && t.entidad !== state.entidad) return false;
    if(q && !searchBlob(t).includes(q)) return false;
    return true;
  });
}


/* Documentos que se repiten en varios trámites */
function docsComunes(){
  const m = new Map();
  TRAMITES.forEach(t => {
    const vistos = new Set();
    allReqs(t).forEach(r => {
      const k = r.t.trim();
      if(vistos.has(k)) return;
      vistos.add(k);
      if(!m.has(k)) m.set(k, []);
      m.get(k).push(t.id);
    });
  });
  return [...m.entries()]
    .filter(([,ids]) => ids.length > 1)
    .map(([doc, ids]) => ({doc, ids, n:ids.length}))
    .sort((a,b) => b.n - a.n || a.doc.localeCompare(b.doc,"es"));
}

function cardHTML(t){
  const nReq = allReqs(t).length, e = ent(t);
  return `
  <button class="card" data-open="${t.id}">
    <div class="card-top">
      <h3>${esc(t.nombre)}</h3>

      <span class="tag">${nReq} requisitos</span>
      ${tieneVariantes(t) ? `<span class="tag var">${t.variantes.length} tipos de proyecto</span>` : ''}

      ${t.depende.length ? `<span class="tag dep">${t.depende.length} previo${t.depende.length>1?'s':''}</span>` : ''}
    </div>
  </button>`;
}

function viewDependencias(){

    .filter(x => x.usos > 0)

  return `
  <div class="vh">
    <h2>Dependencias entre trámites</h2>

        <div class="dep-row">
          ${chipTramite(t.id)}
          <span class="arrow">habilita &rarr;</span>
          <span style="font-size:13px;color:var(--ink-2)">${usos} trámite${usos>1?'s':''} del catálogo</span>

    </div>
    <div class="box-b">
      ${conDep.map(t => `
        <div class="dep-row">
          ${chipTramite(t.id)}

            ${depGrupos(t).sueltas.map(d => chipTramite(d.id, d.modo, d.si)).join("")}

   EVENTOS
   ========================================================================== */
document.addEventListener("click", e => {
  const nav = e.target.closest(".nav button");
  if(nav){ state.view = nav.dataset.view; render(); return; }

  const open = e.target.closest("[data-open]");
  if(open){ state.openId = open.dataset.open; state.variante = null; state.tab = "requisitos"; render(); return; }

  const ent_ = e.target.closest("[data-ent]");
  if(ent_){ state.entidad = ent_.dataset.ent || null; render(); return; }

  const tab = e.target.closest("[data-tab]");
  if(tab){ state.tab = tab.dataset.tab; render(); return; }

  if(e.target.closest("#mx") || e.target.closest("#mClose") || e.target.id === "ov"){
    state.openId = null; render(); return;
  }
  if(e.target.closest("#doPrint")){
    if(state.tab !== "checklist"){ state.tab = "checklist"; render(); }
    setTimeout(() => window.print(), 60);
    return;
  }
  if(e.target.closest("#ckClear")){
    const t = byId(state.openId), codigo = varActual(t);
    state.checks[codigo ? `${t.id}::${codigo}` : t.id] = new Set(); render(); return;
  }
  if(e.target.closest("#clearq")){ state.q = ""; render(); return; }
  if(e.target.closest("#reset")){
    state.q = ""; state.entidad = null; render(); return;
  }
});

document.addEventListener("change", e => {
  if(e.target.id === "varSel"){ state.variante = e.target.value; render(); return; }

  const ck = e.target.closest("[data-ck]");
  if(!ck || !state.openId) return;
  const t = byId(state.openId), codigo = varActual(t);
  const clave = codigo ? `${t.id}::${codigo}` : t.id;
  const i = Number(ck.dataset.ck);
  if(!state.checks[clave]) state.checks[clave] = new Set();
  ck.checked ? state.checks[clave].add(i) : state.checks[clave].delete(i);
  render();
});

document.addEventListener("input", e => {
  if(e.target.id === "q"){ state.q = e.target.value; render(); }
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && state.openId){ state.openId = null; render(); }
});

/* ==========================================================================
   AGENTE DE CONSULTAS

   La interfaz habla solo con AGENTE.responder(pregunta), que devuelve una
   promesa con {texto, tramites, fuente}. Hoy resuelve `motorLocal` sobre el
   catálogo embebido. Para conectar IA real, escriba un motor equivalente
   (por ejemplo, una llamada a un flujo de Power Automate) y asígnelo con
   AGENTE.usarMotor(...). Nada más de la app necesita cambiar.
   ========================================================================== */

const PALABRAS_VACIAS = new Set(("de del la las los el un una unos unas y o u en para por con " +
  "que cual cuales como cuanto cuanta cuantos cuantas donde cuando quien quienes " +
  "necesito necesita necesitan requiere requieren requisitos requisito pide piden " +
  "hacer sacar tramitar solicitar presentar es son esta estan hay tengo tiene tienen " +
  "me mi mis se lo al a").split(" "));

const tokens = s => norm(s).replace(/[^a-z0-9ñ\s]/g, " ").split(/\s+/).filter(Boolean);

/* --- Reconocimiento de institución mencionada --- */
const ALIAS_ENTIDAD = {
  SO:["soyapango","san salvador este"],
  SS:["san salvador centro","ss centro","centro"],
  ANDA:["anda","agua","acueducto","alcantarillado"],
  MOP:["mop","obras publicas","caminos","carretera"],
  AAC:["aac","aviacion civil","aviacion","pararrayos"],
  OPAMSS:["opamss"]
};

function entidadMencionada(q){
  const n = norm(q);
  let mejor = null, largo = 0;
  Object.entries(ALIAS_ENTIDAD).forEach(([k, alias]) => alias.forEach(a => {
    if(n.includes(a) && a.length > largo){ mejor = k; largo = a.length; }
  }));
  return mejor;
}

/* Palabras que encabezan media docena de nombres y por tanto no distinguen
   nada: sin esto, "permiso de tala" puntúa igual en Tala, Terracería,
   Demolición y Remodelación. */
const GENERICAS = new Set(("permiso permisos tramite tramites inscripcion solicitud " +
  "autorizacion certificacion").split(" "));

/* Palabras completas de un campo, para no dar por válido que "lado"
   coincida dentro de "alcantarillado" ni "existe" dentro de "existente". */
const palabrasDe = s => new Set(norm(s).split(/[^a-z0-9ñ]+/).filter(Boolean));

/* Términos que sí identifican a un trámite dentro de su nombre */
function distintivos(t){
  return tokens(t.nombre).filter(x =>
    x.length > 2 && !GENERICAS.has(x) && !PALABRAS_VACIAS.has(x));
}

/* --- Puntaje de un trámite frente a la pregunta --- */
function puntuar(t, toks, entidad){
  if(!toks.length) return 0;
  const nombre = norm(t.nombre), desc = norm(t.descripcion), area = norm(t.area);
  const cuerpo = searchBlob(t);
  const set = new Set(toks);
  const wNombre = palabrasDe(t.nombre), wArea = palabrasDe(t.area), wDesc = palabrasDe(t.descripcion);
  /* Coincidencia real: la palabra completa, o un prefijo largo del nombre
     para tolerar la morfología ("construccion" ↔ "construcciones"). */
  const real = (tok, palabras, prefijos) =>
    palabras.has(tok) ||
    (prefijos && tok.length >= 5 && [...palabras].some(w => w.startsWith(tok) || tok.startsWith(w)));
  let p = 0, tocaCabecera = false;
  toks.forEach(tok => {
    if(PALABRAS_VACIAS.has(tok) || tok.length < 3) return;
    const peso = GENERICAS.has(tok) ? 0.5 : 1;
    if(nombre.includes(tok)){ p += 10 * peso; if(real(tok, wNombre, true)) tocaCabecera = true; }
    if(area.includes(tok)){ p += 4 * peso; if(real(tok, wArea)) tocaCabecera = true; }
    if(desc.includes(tok)){ p += 3 * peso; if(real(tok, wDesc)) tocaCabecera = true; }
    if(cuerpo.includes(tok)) p += 1 * peso;
  });
  /* Sin una coincidencia de palabra completa en nombre, área o descripción,
     lo que hay son fragmentos sueltos rozando el texto: no es un resultado. */
  if(!tocaCabecera) return 0;
  /* Bono decisivo: la pregunta nombra el trámite por sus términos propios */
  const d = distintivos(t);
  if(d.length && d.every(x => set.has(x))) p += 40;
  if(entidad) p = t.entidad === entidad ? p * 2 : p * 0.35;
  return p;
}

function buscarTramites(q, entidad, limite){
  const toks = tokens(q);
  const todos = TRAMITES
    .map(t => ({t, p:puntuar(t, toks, entidad)}))
    .filter(x => x.p > 0)
    .sort((a,b) => b.p - a.p || a.t.nombre.localeCompare(b.t.nombre, "es"));
  if(!todos.length) return [];
  /* Piso de relevancia: descarta lo que apenas rozó la pregunta por una
     palabra suelta, para no ofrecer "también podría referirse a" absurdos. */
  const piso = todos[0].p * 0.4;
  return todos.filter(x => x.p >= piso).slice(0, limite || 6);
}

/* --- Búsqueda dentro del texto de los documentos ---
   Cada línea de requisito del catálogo, con su procedencia, para poder
   citarla cuando la respuesta venga de ahí. */
function corpusReq(t){
  const filas = [
    ...t.reqTecnicos.map(x => ({texto:x, de:"Requisitos técnicos"})),
    ...t.reqGenerales.map(x => ({texto:x.t, de:t.etiquetaGenerales || "Requisitos generales"})),
    ...t.externos.map(x => ({texto:x, de:"Requisito externo"}))
  ];
  (t.variantes || []).forEach(v => {
    v.reqTecnicos.forEach(x => filas.push({texto:x, de:v.codigo}));
    (v.reqOpcionales || []).forEach(x => filas.push({texto:x, de:v.codigo + ", si lo solicitan"}));
  });
  return filas;
}

/* Palabras de la pregunta que vale la pena buscar en los documentos */
function terminos(q){
  return tokens(q).filter(x => x.length > 2 && !PALABRAS_VACIAS.has(x) && !GENERICAS.has(x));
}

/* Las mismas palabras, pero tal como las escribió quien pregunta: para el
   encabezado de la respuesta, donde "autentica firma" se lee peor que
   "auténtica firma". */
function terminosOriginales(q){
  const buscados = new Set(terminos(q));
  return String(q).split(/[^\p{L}\p{N}]+/u)
    .filter(p => buscados.has(norm(p)));
}

/* ¿La palabra `tok` está en este conjunto de palabras? Completa, o como
   prefijo de 5+ letras para tolerar plurales y flexiones. */
const coincide = (tok, palabras) =>
  palabras.has(tok) || (tok.length >= 5 && [...palabras].some(w => w.startsWith(tok)));

/* Trámites cuyo texto contiene TODOS los términos de la pregunta.
   Devuelve también las líneas donde aparecen, para poder citarlas. */
function buscarEnDocumentos(q){
  const toks = terminos(q);
  if(!toks.length) return [];
  const res = [];
  TRAMITES.forEach(t => {
    const filas = corpusReq(t);
    const global = palabrasDe(filas.map(f => f.texto).join(" "));
    if(!toks.every(tok => coincide(tok, global))) return;
    const lineas = filas
      .map(f => ({...f, n:toks.filter(tok => coincide(tok, palabrasDe(f.texto))).length}))
      .filter(f => f.n > 0)
      .sort((a,b) => b.n - a.n);
    /* Sin duplicar la misma línea cuando se repite entre variantes */
    const vistas = new Set();
    res.push({t, lineas:lineas.filter(f => !vistas.has(f.texto) && vistas.add(f.texto))});
  });
  return res;
}

/* Escapa el texto y resalta las palabras buscadas, sin tocar las entidades */
function resaltar(texto, toks){
  return String(texto).split(/(\s+)/).map(p => {
    const limpio = norm(p).replace(/[^a-z0-9ñ]/g, "");
    return limpio && toks.some(tok => limpio === tok || (tok.length >= 5 && limpio.startsWith(tok)))
      ? `<mark>${esc(p)}</mark>` : esc(p);
  }).join("");
}

/* --- Intención de la pregunta --- */
const INTENCIONES = [
  {id:"documental",  re:/\b(en que tramites|que tramites piden|que tramites exigen|que tramites incluyen|donde piden|donde exigen|donde aparece|donde sale|quien pide|quienes piden|cuales piden|buscar|busca)\b/},
  {id:"costo",       re:/\b(cuesta|cuanto|costo|costos|precio|precios|arancel|aranceles|tarifa|tarifas|pago|pagar)\b/},
  {id:"dependencias",re:/\b(antes|previo|previos|primero|depende|dependen|dependencia|prerrequisito|requisito previo|orden|secuencia|habilita)\b/},
  {id:"donde",       re:/\b(donde|que institucion|cual institucion|quien emite|quien lo da|a que oficina|en que oficina)\b/},
  {id:"solvencia",   re:/\bsolvencia\b/},
  {id:"comunes",     re:/\b(comun|comunes|siempre|repite|repiten|todos los tramites|paquete)\b/},
  {id:"lista",       re:/\b(que tramites|cuales tramites|listado|lista|todos los|cuantos tramites)\b/},
  {id:"requisitos",  re:/\b(requisito|requisitos|necesito|necesita|llevar|presentar|papeles|documentos|que pido)\b/}
];

function intencion(q){
  const n = norm(q);
  for(const i of INTENCIONES) if(i.re.test(n)) return i.id;
  return "requisitos";
}

/* --- Composición de respuestas --- */
const li = (txt, sub) => `<li${sub ? ' class="sub"' : ''}>${esc(txt)}</li>`;
const nombreLargo = t => `${esc(t.nombre)} (${esc(ent(t).corto)})`;
const nombreLargoTexto = t => `${t.nombre} (${ent(t).corto})`;

function respRequisitos(t){
  const codigo = tieneVariantes(t) ? t.variantes[0].codigo : null;
  const reqs = allReqs(t, codigo);
  const previos = t.depende.length
    ? `<span class="avisa"><b>Antes de ingresarlo:</b> ${
        [...depGrupos(t).sueltas.map(d => esc(byId(d.id).nombre) + (d.si ? " (solo si " + esc(d.si) + ")" : "")),
         ...depGrupos(t).grupos.map(g => "una de estas: " + g.deps.map(d => esc(byId(d.id).nombre)).join(" o "))
        ].join("; ")}.</span>`
    : "";
  const costo = tieneMonto(t)
    ? `<span class="avisa"><b>Costo:</b> ${costoEtiqueta(t)} — ${esc(t.costo.concepto)}.</span>`
    : (t.costo ? `<span class="avisa"><b>Pago:</b> ${esc(t.costo.concepto)}.</span>` : "");
  const varAviso = codigo
    ? `<span class="avisa">Este trámite tiene ${t.variantes.length} tipos de proyecto; abajo se listan los de <b>${esc(codigo)}</b>. Abra la ficha para elegir otro.</span>`
    : "";
  return `<b>${nombreLargo(t)}</b> — ${esc(t.descripcion)}
    <ul>${reqs.map(r => li(r.t, r.sub)).join("")}</ul>
    ${varAviso}${previos}${costo}`;
}

function respCosto(t){
  if(!t.costo) return `<b>${nombreLargo(t)}</b><br>La ficha no declara ningún costo. Conviene confirmarlo en ventanilla.`;
  if(t.costo.monto == null) return `<b>${nombreLargo(t)}</b><br>Exige comprobante de pago pero la ficha no indica el monto: ${esc(t.costo.concepto)}.`;
  const tramos = esEscalonado(t)
    ? `<ul>${t.costo.tramos.map(tr => li(money(tr.monto) + " — " + tr.criterio)).join("")}</ul>`
    : "";
  return `<b>${nombreLargo(t)}</b><br>${costoEtiqueta(t)} — ${esc(t.costo.concepto)}.${tramos}`;
}

function respDependencias(t){
  const g = depGrupos(t);
  /* Un grupo alternativo es una sola decisión, no tantas como opciones tenga */
  const cuenta = g.sueltas.length + g.grupos.length + t.externos.length;
  if(!nPrevios(t)) return `<b>${nombreLargo(t)}</b><br>No depende de ningún otro trámite: se puede ingresar de forma independiente.`;
  const partes = [];
  g.sueltas.forEach(d => partes.push(li(
    byId(d.id).nombre + " (" + ent(byId(d.id)).corto + ")" +
    (d.modo === "estado" ? " — basta con estar solvente" : " — se presenta en físico") +
    (d.si ? ", solo si " + d.si : ""))));
  g.grupos.forEach(gr => partes.push(li(
    "Una de estas: " + gr.deps.map(d => byId(d.id).nombre + " (" + ent(byId(d.id)).corto + ")").join(" o "))));
  t.externos.forEach(e => partes.push(li(e + " — fuera del catálogo", true)));
  const habilita = depDe(t);
  return `<b>${nombreLargo(t)}</b> necesita ${cuenta} cosa${cuenta > 1 ? "s" : ""} antes${
      g.grupos.length ? ` (${g.grupos.length} de ellas son alternativas: basta elegir una opción de cada grupo)` : ""}:
    <ul>${partes.join("")}</ul>
    ${habilita.length ? `<span class="avisa">A su vez, habilita ${habilita.length} trámite${habilita.length > 1 ? "s" : ""}: ${habilita.map(o => esc(o.nombre)).join(", ")}.</span>` : ""}`;
}

function respDonde(t){
  return `<b>${esc(t.nombre)}</b> se tramita en <b>${esc(t.institucion)}</b>, área de ${esc(t.area)}.`;
}

function respDocumental(q, res){
  const toks = terminos(q);
  const originales = terminosOriginales(q);
  const frase = (originales.length ? originales : toks).join(" ");
  const total = res.length;
  const muestra = res.slice(0, 8);
  const items = muestra.map(({t, lineas}) => {
    const citas = lineas.slice(0, 2).map(l =>
      `<li class="sub"><span class="cita">${resaltar(l.texto, toks)}</span> <i class="cita-de">${esc(l.de)}</i></li>`).join("");
    const mas = lineas.length > 2
      ? `<li class="sub"><i class="cita-de">y ${lineas.length - 2} línea${lineas.length - 2 > 1 ? "s" : ""} más en esta ficha</i></li>`
      : "";
    return li(nombreLargoTexto(t)) + citas + mas;
  }).join("");
  return {
    texto: `<b>${esc(frase)}</b> aparece en ${total} trámite${total > 1 ? "s" : ""} del catálogo`
      + (total > muestra.length ? `; se muestran los primeros ${muestra.length}` : "")
      + `:<ul>${items}</ul>`
      + `<span class="avisa">La búsqueda recorre el texto completo de los requisitos, incluidos los de cada tipo de proyecto.</span>`,
    tramites: muestra.map(x => x.t)
  };
}

/* --- Motor local --- */
function motorLocal(pregunta){
  const q = (pregunta || "").trim();
  if(!q) return { texto:"Escriba una pregunta y le busco la respuesta en el catálogo.", tramites:[] };

  const ints = intencion(q);
  const entidad = entidadMencionada(q);

  if(ints === "comunes"){
    const d = docsComunes().slice(0, 8);
    return {
      texto:`Los documentos que más se repiten en los ${TRAMITES.length} trámites del catálogo:
        <ul>${d.map(x => li(`${x.doc} — ${x.n} trámites`)).join("")}</ul>
        <span class="avisa">Tener este paquete listo de antemano acelera casi cualquier gestión.</span>`,
      tramites:[]
    };
  }

  /* "¿Qué trámites piden X?" busca a los dependientes, no a X */
  const preguntaQuienExige = /\b(que|cuales|quienes|cuantos)\b[^?]*\b(piden|pide|exigen|exige|requieren|requiere|necesitan|ocupan)\b/.test(norm(q));

  /* La solvencia tiene respuesta propia porque hay que explicar los dos modos.
     Se detecta por la palabra, no por la intención: "¿qué trámites piden
     solvencia?" resuelve como documental, que se evalúa antes. */
  if(/\bsolvencia\b/.test(norm(q)) && preguntaQuienExige){
    const doc = TRAMITES.filter(t => t.depende.some(d => byId(d.id).nombre === "Solvencia Municipal" && d.modo === "documento"));
    const est = TRAMITES.filter(t => t.depende.some(d => byId(d.id).nombre === "Solvencia Municipal" && d.modo === "estado"));
    return {
      texto:`${doc.length + est.length} trámites exigen la solvencia, pero de dos formas distintas, y confundirlas cuesta un trámite de más.
        <ul>${li(`Hay que presentarla en físico — ${doc.length} trámites`)}${doc.map(t => li(nombreLargoTexto(t), true)).join("")}
            ${li(`Basta con que el inmueble esté solvente — ${est.length} trámites`)}${est.slice(0, 6).map(t => li(nombreLargoTexto(t), true)).join("")}${est.length > 6 ? li(`y ${est.length - 6} más`, true) : ""}</ul>
        <span class="avisa">Los de la segunda lista son casi todos de San Salvador Centro: sus fichas dicen "no es necesario presentar solvencia en físico".</span>`,
      tramites:doc.slice(0, 3)
    };
  }

  const hits = buscarTramites(q, entidad, 6);

  /* Búsqueda documental: explícita cuando la pregunta es "qué trámites piden
     X", y como respaldo cuando ningún trámite coincide por nombre pero la
     palabra sí está dentro de los requisitos. */
  const enDocs = (ints === "documental" || !hits.length) ? buscarEnDocumentos(q) : [];
  if(enDocs.length && (ints === "documental" || !hits.length)){
    const filtrados = entidad ? enDocs.filter(x => x.t.entidad === entidad) : enDocs;
    if(filtrados.length) return respDocumental(q, filtrados);
  }

  if(!hits.length){
    const suger = entidad
      ? `Sí encuentro ${TRAMITES.filter(t => t.entidad === entidad).length} trámites de ${ENTIDADES[entidad].corto}, pero ninguno coincide con lo demás de la pregunta.`
      : `Pruebe con el nombre del trámite (tala, terracería, solvencia, rótulo, pararrayos…), con la institución (Soyapango, San Salvador Centro, ANDA, MOP, OPAMSS) o con cualquier palabra que aparezca en los requisitos (bitácora, mojones, auténtica, hidrológico…).`;
    return { texto:`No encontré nada en el catálogo para esa pregunta. ${suger}`, tramites:[] };
  }

  /* Solo se lista cuando ningún trámite domina con claridad */
  const dominante = hits.length === 1 || hits[0].p >= hits[1].p * 1.8;
  if(ints === "lista" || (!dominante && hits.length > 1)){
    const lista = hits.slice(0, 6).map(x => x.t);
    return {
      texto:`Encontré ${lista.length} trámites que encajan:
        <ul>${lista.map(t => li(`${t.nombre} (${ent(t).corto})${tieneMonto(t) ? " — " + costoEtiqueta(t) : ""}`)).join("")}</ul>
        <span class="avisa">Pregunte por uno en concreto para ver sus requisitos completos.</span>`,
      tramites:lista
    };
  }

  const t = hits[0].t;
  const texto =
    ints === "costo"        ? respCosto(t) :
    ints === "dependencias" ? respDependencias(t) :
    ints === "donde"        ? respDonde(t) :
                              respRequisitos(t);

  const otros = hits.slice(1, 3).map(x => x.t);
  const cola = otros.length
    ? `<span class="avisa">También podría referirse a: ${otros.map(o => esc(o.nombre) + " (" + esc(ent(o).corto) + ")").join(", ")}.</span>`
    : "";
  return { texto: texto + cola, tramites:[t, ...otros] };
}

/* --- Fachada: aquí se cambia el motor --- */
const AGENTE = {
  motor: motorLocal,
  fuente: "Consulta directa sobre el catálogo",
  usarMotor(fn, etiqueta){
    this.motor = fn;
    this.fuente = etiqueta || "Motor externo";
    const el = $("#agFuente");
    if(el) el.textContent = this.fuente;
  },
  responder(pregunta){
    return Promise.resolve(this.motor(pregunta));
  }
};

const SUGERENCIAS = [
  "¿Qué necesito para el permiso de tala en Soyapango?",
  "¿Cuánto cuesta la revisión gráfica y alfanumérica?",
  "¿Qué debo tener antes del permiso de construcción de OPAMSS?",
  "¿Qué trámites piden bitácora?",
  "¿Dónde aparece el estudio hidrológico?",
  "¿Qué documentos se repiten en todos los trámites?"
];

const agHistorial = [];

function agRender(){
  const log = $("#agLog");
  if(!log) return;
  if(!agHistorial.length){
    log.innerHTML = `
      <div class="ag-msg bot">
        Pregunte lo que necesite sobre los ${TRAMITES.length} trámites del catálogo: requisitos, costos, qué va antes de qué, o en qué institución se hace. También puede buscar cualquier palabra que aparezca dentro de los documentos.
        <div class="ag-sug">${SUGERENCIAS.map(s => `<button data-sug="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      </div>`;
  } else {
    log.innerHTML = agHistorial.map(m => m.rol === "yo"
      ? `<div class="ag-msg yo">${esc(m.texto)}</div>`
      : `<div class="ag-msg bot">${m.texto}${
          m.tramites && m.tramites.length
            ? `<div class="ag-cta">${m.tramites.map(t => `<button data-open="${t.id}">Ver ${esc(t.nombre)}</button>`).join("")}</div>`
            : ""}</div>`
    ).join("");
  }
  log.scrollTop = log.scrollHeight;
}

/* Devuelve la promesa para que quien llame pueda esperar la respuesta;
   el panel no la necesita, pero las pruebas y un motor remoto sí. */
function agPreguntar(pregunta){
  const q = (pregunta || "").trim();
  if(!q) return Promise.resolve(null);
  agHistorial.push({ rol:"yo", texto:q });
  agRender();
  return AGENTE.responder(q).then(r => {
    agHistorial.push({ rol:"bot", texto:r.texto, tramites:r.tramites || [] });
    agRender();
    return r;
  });
}

function agAbrir(abrir){
  const p = $("#agPanel"), f = $("#agFab");
  if(!p) return;
  p.hidden = !abrir;
  f.classList.toggle("on", abrir);
  if(abrir){ agRender(); const i = $("#agInput"); if(i) i.focus(); }
}

document.addEventListener("click", e => {
  if(e.target.closest("#agFab")){ agAbrir($("#agPanel").hidden); return; }
  if(e.target.closest("#agClose")){ agAbrir(false); return; }
  const sug = e.target.closest("[data-sug]");
  if(sug){ agPreguntar(sug.dataset.sug); return; }
});

document.addEventListener("submit", e => {
  if(e.target.id !== "agForm") return;
  e.preventDefault();
  const i = $("#agInput");
  agPreguntar(i.value);
  i.value = "";
});

initMarca();
initStats();
render();
agRender();

/* Exponer para pruebas automatizadas */
if(typeof window !== "undefined"){
  window.__APP__ = {MARCA, LOGO, TRAMITES, ENTIDADES, ent, state, render, filtered, allReqs, docsComunes,
    byId, textoCompleto, depIds, depDe, nPrevios, tieneMonto, esEscalonado, costoEtiqueta,
    depGrupos, tieneVariantes, variantePorId, varActual,
    AGENTE, motorLocal, intencion, entidadMencionada, buscarTramites, distintivos,
    corpusReq, buscarEnDocumentos, terminos, terminosOriginales, resaltar,
    agHistorial, agPreguntar, agAbrir};
}
</script>
